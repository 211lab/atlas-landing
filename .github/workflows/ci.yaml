name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile generator/generate.py
          python -m unittest discover -s tests
          node --test tests/prompt-tool.test.mjs
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --config .gitleaks.toml --redact
      - name: Build container
        run: docker build -t atlas-background:test .
